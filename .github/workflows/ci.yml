name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Base images (pinned by digest) and build tooling come from Google's mirror
  # of Docker Hub: anonymous Docker Hub pulls are rate limited per runner.
  BASE_REGISTRY: mirror.gcr.io/library
  TOOLS_REGISTRY: mirror.gcr.io

jobs:
  validate:
    name: Validate and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: make validate lint

  # Every image built natively on each architecture (no emulation), then the
  # contract smoke test and the whole reference-to-reference self-test on
  # vcan interfaces of the runner.
  selftest:
    name: Build and self-test (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install jsonschema

      - name: Load the CAN modules and create vcan0, vcan1
        run: scripts/ci-can-modules.sh && make vcan ADMIN=sudo

      - name: Build the images
        run: make -j4 --output-sync=target images

      - name: Smoke test
        run: make smoke

      - name: Self-test
        run: make selftest ADMIN=sudo

      - name: Validate the documents
        if: always()
        run: make documents

      - name: Compatibility report
        if: always()
        run: |
          if [ -f reports/selftest.json ]; then
            python3 scripts/compat-report.py reports/selftest.json > reports/COMPATIBILITY.md
            cat reports/COMPATIBILITY.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selftest-${{ matrix.arch }}
          path: reports/
          if-no-files-found: warn

  # Kernel ISO-TP on the stock Ubuntu generic kernel in a virtme-ng microVM
  # (KVM on GitHub's amd64 runners), instead of the runner's Azure kernel,
  # which lacks can-isotp. The images are exported to root file systems and
  # run with chroot in the guest (scripts/chroot-run, scripts/microvm-isotp.sh).
  # TESTING.md, "Kernel ISO-TP in a microVM".
  isotp-microvm:
    name: Kernel ISO-TP in a microVM (amd64)
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: KVM, QEMU and virtme-ng
        run: |
          sudo chmod 666 /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 busybox-static >/dev/null
          pipx install virtme-ng
          sudo ln -sf "$(command -v vng)" /usr/local/bin/vng
      - name: Build the images
        run: make -j3 --output-sync=target image-canutils image-pythoncanisotp image-pythoncan
      - name: ISO-TP suite in the microVM
        run: scripts/microvm-isotp.sh reports
      - name: Summary
        if: always()
        run: |
          if [ -f reports/selftest.json ]; then
            python3 scripts/compat-report.py reports/selftest.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: selftest-isotp-microvm
          path: reports/
          if-no-files-found: warn

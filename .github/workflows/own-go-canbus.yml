name: Own stack (go-canbus)
run-name: "Build canbus-interop-otfabric from the latest go-canbus, by @${{ github.actor }} on ${{ github.ref_name }}"

# Manual only. Builds ghcr.io/otfabric/canbus-interop-otfabric from the latest
# go-canbus release, tests it with the self-tests and references of the latest
# harness release and, when run from main, publishes it as :<go-canbus version>
# and :latest.
#
# Nothing is committed, and nothing else waits for this: no pin to bump, no
# release, no schedule. So no release loop can form (own/go-canbus/README.md).
# The harness Release workflow and manifest.json do not contain this image.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: own-go-canbus
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/otfabric/canbus-interop-otfabric
  BASE_REGISTRY: mirror.gcr.io/library

jobs:
  version:
    name: Resolve versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      upstream: ${{ steps.version.outputs.upstream }}
      revision: ${{ steps.version.outputs.revision }}
      harness: ${{ steps.version.outputs.harness }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        name: The latest go-canbus, and the harness release to test against
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          upstream=$(git ls-remote --tags --refs https://github.com/otfabric/go-canbus.git 'v[0-9]*' \
            | sed 's,.*refs/tags/,,' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          [ -n "${upstream}" ] || { echo "::error::no go-canbus release found"; exit 1; }
          # An annotated tag has a peeled line, with the commit.
          revision=$(git ls-remote --tags https://github.com/otfabric/go-canbus.git "refs/tags/${upstream}^{}" | cut -f1)
          [ -n "${revision}" ] || revision=$(git ls-remote --tags https://github.com/otfabric/go-canbus.git "refs/tags/${upstream}" | cut -f1)
          harness=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          [ -n "${harness}" ] || { echo "::error::no harness release found"; exit 1; }
          if [ "${REF}" = "main" ]; then publish="yes: ${IMAGE}:${upstream} and ${IMAGE}:latest"; else publish="no: not run from main"; fi
          {
            echo "upstream=${upstream}"
            echo "revision=${revision}"
            echo "harness=${harness}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Versions"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| go-canbus (latest release) | \`${upstream}\` |"
            echo "| go-canbus commit | \`${revision}\` |"
            echo "| Image tag | \`${upstream}\` |"
            echo "| Reference images (latest harness release) | \`${harness}\` |"
            echo "| This repository | \`${REF}\` at \`${SHA}\` |"
            echo "| Publish | ${publish} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: Build, test (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.version.outputs.harness }}
      UPSTREAM: ${{ needs.version.outputs.upstream }}
      REVISION: ${{ needs.version.outputs.revision }}
      ADAPTER_IMAGE_otfabric: ghcr.io/otfabric/canbus-interop-otfabric:ci
      # Every reference image of the harness release.
      REFERENCES: canutils pythoncan socketcanrs scapy pythoncanisotp cantools canmatrix
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install jsonschema

      - name: Build from go-canbus ${{ needs.version.outputs.upstream }}
        run: |
          scripts/retry.sh docker build --progress=plain --build-arg BASE_REGISTRY="${BASE_REGISTRY}" \
            --build-arg UPSTREAM_VERSION="${UPSTREAM}" --build-arg UPSTREAM_SHA="${REVISION}" \
            --build-arg ADAPTER_VERSION="${UPSTREAM}" \
            --tag "${ADAPTER_IMAGE_otfabric}" --file own/go-canbus/Dockerfile .

      - name: What was built
        run: |
          reported=$(docker run --rm "${ADAPTER_IMAGE_otfabric}" print-version | jq -r '.version')
          {
            echo "## ${{ matrix.arch }}"
            echo
            docker run --rm "${ADAPTER_IMAGE_otfabric}" print-version | jq -r '"- upstream \(.upstream) \(.version), commit `\(.revision)`, independent engine: \(.independentEngine)"'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "${reported}" = "${UPSTREAM}" ] || { echo "::error::the image reports go-canbus ${reported}, want ${UPSTREAM}"; exit 1; }

      # The self-tests are those of the harness release whose reference images
      # they run against: main's scripts may already check what only the next
      # release's references do.
      - name: Check out the self-tests of ${{ needs.version.outputs.harness }}
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.harness }}
          path: harness

      - name: Pull the reference images of ${{ needs.version.outputs.harness }}
        run: |
          for a in ${REFERENCES}; do
            scripts/retry.sh docker pull --quiet "ghcr.io/otfabric/canbus-interop-${a}:${VERSION}"
            docker run --rm "ghcr.io/otfabric/canbus-interop-${a}:${VERSION}" print-version \
              | jq -r --arg image "${a}:${VERSION}" '"- \($image): \(.upstream) \(.version)"' | tee -a "$GITHUB_STEP_SUMMARY"
          done

      # CAN interfaces are network devices of the runner: the containers run
      # with --network host on vcan0, vcan1 and vcanxl0, as in ci.yml. The
      # amd64 runner kernel has no can-isotp: there the kernel ISO-TP
      # (canutils) pairs are recorded as not tested; the userspace ones run.
      - name: Load the CAN modules and create vcan0, vcan1, vcanxl0
        working-directory: harness
        env:
          CAN_ISOTP_OUT_OF_TREE: "0"
        run: scripts/ci-can-modules.sh && make vcan ADMIN=sudo

      - name: Smoke, cross-stack self-test against the references, document schemas
        working-directory: harness
        env:
          SUITES: raw isotp dbc xl
          ADMIN: sudo
        run: |
          set -o pipefail
          mkdir -p reports
          REPORT_DIR=reports scripts/smoke.sh otfabric
          REPORT_DIR=reports scripts/interop.sh otfabric ${REFERENCES} 2>&1 | tee reports/interop.log
          python3 scripts/validate-documents.py reports
          python3 scripts/compat-report.py reports/selftest.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload documents
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: own-go-canbus-documents-${{ matrix.arch }}
          path: |
            harness/reports/
            reports/
          if-no-files-found: ignore

      - name: Push the tested image as <version>-<arch>
        if: github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${ACTOR}" --password-stdin
          docker tag "${ADAPTER_IMAGE_otfabric}" "${IMAGE}:${UPSTREAM}-${ARCH}"
          scripts/retry.sh docker push --quiet "${IMAGE}:${UPSTREAM}-${ARCH}"

  publish:
    name: Publish ${{ needs.version.outputs.upstream }} and latest
    needs: [version, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      UPSTREAM: ${{ needs.version.outputs.upstream }}
    steps:
      - uses: actions/checkout@v7
      - name: Join the architectures
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${ACTOR}" --password-stdin
          scripts/retry.sh docker buildx imagetools create --tag "${IMAGE}:${UPSTREAM}" --tag "${IMAGE}:latest" \
            "${IMAGE}:${UPSTREAM}-amd64" "${IMAGE}:${UPSTREAM}-arm64"
          digest=$(scripts/retry.sh docker buildx imagetools inspect "${IMAGE}:${UPSTREAM}" --format '{{.Manifest.Digest}}')
          {
            echo "## Published"
            echo
            echo "- \`${IMAGE}:${UPSTREAM}\`"
            echo "- \`${IMAGE}:latest\`"
            echo "- \`${IMAGE}@${digest}\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
